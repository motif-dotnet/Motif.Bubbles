    <text x="365" y="112.25" font-size="14" fill="#1E293B" text-anchor="middle" dominant-baseline="central" font-weight="600">Code Folders</text>
    <text x="365" y="127.88" font-size="11" fill="#1E293B" text-anchor="middle" dominant-baseline="central" fill-opacity="0.8">Local folder (opened or</text>
    <text x="365" y="141.62" font-size="11" fill="#1E293B" text-anchor="middle" dominant-baseline="central" fill-opacity="0.8">dropped)</text>
