    </marker>
  </defs>
  <rect x="-470" y="-205" width="960" height="410" fill="#FFFFFF" />
  <g class="relationship" data-id="b0b1b001">
    <line x1="-260" y1="0" x2="-120" y2="0" stroke="#52606D" stroke-width="1.5" stroke-linecap="round" class="outline" marker-end="url(#arrow)" />
    <rect x="-229.72" y="-22.5" width="79.45" height="15" fill="#FFFFFF" stroke="none" stroke-width="0" />
    <text x="-190" y="-15" font-size="12" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Opens a repo</text>
    <rect x="-233.17" y="-7.5" width="86.34" height="15" fill="#FFFFFF" stroke="none" stroke-width="0" />
    <text x="-190" y="0" font-size="12" fill="#0F172A" text-anchor="middle" dominant-baseline="central">and looks over</text>
    <rect x="-223.64" y="7.5" width="67.28" height="15" fill="#FFFFFF" stroke="none" stroke-width="0" />
    <text x="-190" y="15" font-size="12" fill="#0F172A" text-anchor="middle" dominant-baseline="central">its bubbles</text>
  </g>
  <g class="relationship" data-id="b0b1b002">
    <line x1="120" y1="-39.45" x2="280" y2="-92.05" stroke="#52606D" stroke-width="1.5" stroke-linecap="round" class="outline" marker-end="url(#arrow)" />
