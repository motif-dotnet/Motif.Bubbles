    <text x="365" y="-118.12" font-size="11" fill="#1E293B" text-anchor="middle" dominant-baseline="central" fill-opacity="0.8">api.github.com and</text>
    <text x="365" y="-104.38" font-size="11" fill="#1E293B" text-anchor="middle" dominant-baseline="central" fill-opacity="0.8">raw.githubusercontent.com…</text>
  </g>
  <g class="element" data-id="b0b1a004" data-type="externalSystem">
    <rect x="280" y="-45" width="170" height="90" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2" class="outline" />
    <text x="365" y="-6.88" font-size="14" fill="#1E293B" text-anchor="middle" dominant-baseline="central" font-weight="600">GitHub Pages</text>
    <text x="365" y="8.75" font-size="11" fill="#1E293B" text-anchor="middle" dominant-baseline="central" fill-opacity="0.8">HTTPS</text>
  </g>
