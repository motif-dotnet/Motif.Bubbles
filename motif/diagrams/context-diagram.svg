  <g class="element" data-id="b0b1a001" data-type="system">
    <rect x="-120" y="-65" width="240" height="130" rx="6" ry="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="3" class="outline" />
    <text x="0" y="-22.62" font-size="16" fill="#0F172A" text-anchor="middle" dominant-baseline="central" font-weight="600">Motif.Bubbles</text>
    <text x="0" y="-1.75" font-size="11" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Draws a Motif app's architecture as a graph</text>
    <text x="0" y="12" font-size="11" fill="#0F172A" text-anchor="middle" dominant-baseline="central">of bubbles, sized by its code and ringed with</text>
    <text x="0" y="25.75" font-size="11" fill="#0F172A" text-anchor="middle" dominant-baseline="central">its Stryker results</text>
  </g>
