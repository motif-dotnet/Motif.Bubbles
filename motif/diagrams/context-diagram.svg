<?xml version="1.0" encoding="utf-8"?>
<svg width="960" height="410" viewBox="-470 -205 960 410" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <title>Motif Bubbles</title>
  <defs>
    <marker id="arrow" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="12" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
