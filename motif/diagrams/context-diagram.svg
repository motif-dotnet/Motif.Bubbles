    <text x="200" y="-73.25" font-size="12" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Reads a public</text>
    <rect x="164.72" y="-65.75" width="70.56" height="15" fill="#FFFFFF" stroke="none" stroke-width="0" />
    <text x="200" y="-58.25" font-size="12" fill="#0F172A" text-anchor="middle" dominant-baseline="central">repo's code</text>
