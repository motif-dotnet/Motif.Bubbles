    <text x="200" y="-15" font-size="12" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Fetches the</text>
    <rect x="158.43" y="-7.5" width="83.14" height="15" fill="#FFFFFF" stroke="none" stroke-width="0" />
    <text x="200" y="0" font-size="12" fill="#0F172A" text-anchor="middle" dominant-baseline="central">repo's Stryker</text>
    <rect x="179.36" y="7.5" width="41.29" height="15" fill="#FFFFFF" stroke="none" stroke-width="0" />
    <text x="200" y="15" font-size="12" fill="#0F172A" text-anchor="middle" dominant-baseline="central">report</text>
  </g>
  <g class="relationship" data-id="b0b1b004">
    <line x1="120" y1="39.45" x2="280" y2="92.05" stroke="#52606D" stroke-width="1.5" stroke-linecap="round" class="outline" marker-end="url(#arrow)" />
    <rect x="152.94" y="43.25" width="94.12" height="15" fill="#FFFFFF" stroke="none" stroke-width="0" />
    <text x="200" y="50.75" font-size="12" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Reads a folder's</text>
    <rect x="150.48" y="58.25" width="99.04" height="15" fill="#FFFFFF" stroke="none" stroke-width="0" />
    <text x="200" y="65.75" font-size="12" fill="#0F172A" text-anchor="middle" dominant-baseline="central">code and Stryker</text>
    <rect x="176.43" y="73.25" width="47.13" height="15" fill="#FFFFFF" stroke="none" stroke-width="0" />
    <text x="200" y="80.75" font-size="12" fill="#0F172A" text-anchor="middle" dominant-baseline="central">reports</text>
